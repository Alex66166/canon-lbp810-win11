name: Build Windows CAPT prototype
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Configure MSVC x64 with pinned libcapt
        run: cmake -S native -B build -G "Visual Studio 17 2022" -A x64
      - name: Build native executable
        run: cmake --build build --config Release --parallel 2
      - name: Run offline CAPT compression test
        shell: pwsh
        run: |
          & ./build/Release/lbp810-bridge.exe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check PowerShell script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path ./Install-LBP810.ps1), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List | Out-String | Write-Host
            exit 1
          }
      - name: Build SHA256 checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item ./build/Release/lbp810-bridge.exe ./dist/lbp810-bridge.exe
          (Get-FileHash ./dist/lbp810-bridge.exe -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content -Encoding Ascii ./dist/lbp810-bridge.sha256
      - name: Upload archive to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: lbp810-native-x64
          path: dist/*
      - name: Publish rolling dev prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view dev >$null 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create dev --prerelease --target $env:GITHUB_SHA --title "Development snapshot (hardware unverified)" --notes "Experimental USB CAPT test tool. Not a Windows printer driver."
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload dev ./dist/lbp810-bridge.exe ./dist/lbp810-bridge.sha256 --clobber
          exit $LASTEXITCODE
